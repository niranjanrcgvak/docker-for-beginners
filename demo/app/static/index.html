<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Notes - Docker Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f6fb; margin: 0; }
    .wrap { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { color: #0b5ed7; margin-bottom: 4px; }
    .sub { color: #5b6b7f; margin-top: 0; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input { flex: 1; padding: 10px; border: 1px solid #c5d0de; border-radius: 6px; font-size: 15px; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; background: #0b5ed7; color: #fff; cursor: pointer; font-size: 15px; }
    li { background: #fff; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    li small { color: #8a98aa; display: block; }
    li button { background: #e5484d; padding: 6px 10px; font-size: 13px; }
    ul { list-style: none; padding: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Team Notes</h1>
    <p class="sub">Flask + PostgreSQL, running in Docker containers</p>
    <form id="f">
      <input id="text" placeholder="Write a note..." autocomplete="off" required>
      <button>Add</button>
    </form>
    <ul id="list"></ul>
  </div>
  <script>
    const list = document.getElementById("list");

    async function load() {
      const res = await fetch("/api/notes");
      const notes = await res.json();
      list.innerHTML = "";
      notes.forEach(n => {
        const li = document.createElement("li");
        const left = document.createElement("div");
        left.textContent = n.text;
        const small = document.createElement("small");
        small.textContent = n.created_at;
        left.appendChild(small);
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = async () => { await fetch("/api/notes/" + n.id, { method: "DELETE" }); load(); };
        li.append(left, del);
        list.appendChild(li);
      });
    }

    document.getElementById("f").addEventListener("submit", async e => {
      e.preventDefault();
      const input = document.getElementById("text");
      await fetch("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: input.value })
      });
      input.value = "";
      load();
    });

    load();
  </script>
</body>
</html>
